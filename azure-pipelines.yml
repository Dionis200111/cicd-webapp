trigger:
- main

pool:
  name: onpremisepool

steps:

# 1. Get the code from GitHub
- checkout: self


# 2. Build the WAR file with Maven
- script: mvn clean package
  displayName: 'Build WAR with Maven'


# 3. Build the Docker image
- script: docker build -t cicd-webapp:latest .
  displayName: 'Build Docker image'


# 4. Stop and remove the previous container, then start the new one
- powershell: |
    docker stop cicd-webapp 2>$null
    docker rm cicd-webapp 2>$null

    docker run -d `
      --name cicd-webapp `
      -p 8080:8080 `
      cicd-webapp:latest

    docker ps
  displayName: 'Deploy Docker container'